<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RegistroF</title>
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form action="" method="post">
        <label for="id">ID:</label>
        <input type="text" id="id" name="id"><br><br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido"><br><br>

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" name="cargo"><br><br>

        <label for="cedula">Cédula:</label>
        <input type="text" id="cedula" name="cedula"><br><br>

        <label for="fecha_nac">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nac" name="fecha_nac"><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="fecha_ingreso">Fecha de ingreso:</label>
        <input type="date" id="fecha_ingreso" name="fecha_ingreso"><br><br>

        <label for="id_m_biologica">ID muestra biológica:</label>
        <input type="text" id="id_m_biologica" name="id_m_biologica"><br><br>

        <input type="submit" value="Registrar">
    </form>
</body>
</html>
