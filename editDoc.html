<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Documento</title>
    <link rel="stylesheet" href="editDoc.css">
</head>
<body>
    <header>
        <h1>Hospital de Clínicas</h1>
    </header>

    <main>
        <div class="panel form-panel">
            <h2>Editar Documento</h2>
            <form action="" method="post" enctype="multipart/form-data">
                <div class="form-field">
                    <label for="archivo">Archivo (PDF u otro formato estándar):</label>
                    <input type="file" id="archivo" name="archivo" accept=".pdf,.doc,.docx,.odt">
                </div>

                <div class="form-field">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" value="Indicaciones de interrupción voluntaria del embarazo">
                </div>

                <div class="form-field">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="3">Indicaciones e información para el paciente.</textarea>
                </div>

                <div class="form-field">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria">
                        <option value="informacion_general" selected>Información general</option>
                        <option value="indicaciones">Indicaciones médicas</option>
                        <option value="estudios">Estudios imagenológicos</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="encuestas">Encuestas</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="fecha_publicacion">Fecha de publicación:</label>
                    <input type="date" id="fecha_publicacion" name="fecha_publicacion" value="2026-02-10">
                </div>

                <div class="form-field">
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado">
                        <option value="activo" selected>Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>

                <div class="form-field">
                    <input type="submit" value="Guardar Cambios">
                </div>

                <p class="back-link"><a href="docCar.html">&larr; Volver a documentos cargados</a></p>
            </form>
            <p class="back-link"><a href="index.html">&larr; Volver al inicio</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
    </footer>
</body>
</html>
