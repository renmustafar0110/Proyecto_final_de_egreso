<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Funcionario</title>
    <link rel="stylesheet" href="../css/registroF.css">
</head>
<body>
    <header>
        <img src="../logo_del_proyecto.jpeg" alt="Logo" class="header-logo"><h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
    </header>

    <main>
        <div class="panel form-panel">
            <h2>Formulario de Registro - Funcionario</h2>
            <form action="" method="post" id="form-registro" novalidate>
                <div class="form-field">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="form-field">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido">
                </div>

                <div class="form-field">
                    <label for="cargo">Cargo:</label>
                    <input type="text" id="cargo" name="cargo">
                </div>

                <div class="form-field">
                    <label for="cedula">Cédula:</label>
                    <input type="number" id="cedula" name="cedula">
                </div>

                <div class="form-field">
                    <label for="fecha_nac">Fecha de nacimiento:</label>
                    <input type="date" id="fecha_nac" name="fecha_nac">
                </div>

                <div class="form-field">
                    <label for="telefono">Teléfono:</label>
                    <input type="number" id="telefono" name="telefono">
                </div>

                <div class="form-field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-field">
                    <label for="fecha_ingreso">Fecha de ingreso:</label>
                    <input type="date" id="fecha_ingreso" name="fecha_ingreso">
                </div>

                <div class="alerta" id="alerta-acceso">Acceso denegado</div>

                <div class="form-field">
                    <input type="submit" value="Registrar">
                </div>

                <p class="back-link"><a href="loginF.html">¿Ya tenés cuenta? Inicia sesión</a></p>
            </form>
            <p class="back-link"><a href="index.html">&larr; Volver al inicio</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
    </footer>

    <script src="../js/registroF.js"></script>
    <script src="../js/fechaYhora.js"></script></body>
</html>
