<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Documentos</title>
    <link rel="stylesheet" href="../css/buscador_Documentos.css">
    <link rel="stylesheet" href="../css/menu_Header.css">
</head>
<body>
    <header>
        <img src="../img/logo_del_proyecto.jpeg" alt="Logo" class="header-logo">
        <h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
        <div class="menu-botones">
            <button id="btn-cerrar-sesion" class="btn-salir" aria-label="Cerrar sesión">Cerrar sesión</button>
        </div>
    </header>

    <main>
        <div class="panel page-panel">
            <div class="encabezado-panel">
                <div>
                    <h2>Buscador de Documentos</h2>
                    <p class="subtitulo" id="datos-paciente"></p>
                </div>
                <button type="button" id="btn-encuestas-pendientes" class="btn-encuestas">Encuestas Pendientes</button>
            </div>

            <div class="acciones-paciente">
            </div>

            <div class="filtros">
                <div class="filtro">
                    <label for="filtro-categoria">Categoría:</label>
                    <select id="filtro-categoria">
                        <option value="">Todas las categorías</option>
                        <option value="informacion_general">Información general</option>
                        <option value="indicaciones">Indicaciones médicas</option>
                        <option value="estudios">Estudios imagenológicos</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="encuestas">Encuestas</option>
                    </select>
                </div>

                <div class="filtro">
                    <label for="filtro-titulo">Título:</label>
                    <input type="text" id="filtro-titulo" placeholder="Buscar por título">
                </div>

                <div class="filtro">
                    <button type="button" id="btn-buscar">Buscar</button>
                </div>
            </div>

            <p class="sin-resultados" id="aviso-sin-resultados" style="display: none;">No se encontraron documentos con ese criterio.</p>

            <table class="documentos-table">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Categoría</th>
                        <th>Fecha publicación</th>
                        <th>Paciente</th>
                        <th>Cédula</th>
                        <th>Código QR</th>
                    </tr>
                </thead>
                <tbody id="tabla-documentos">
                </tbody>
            </table>
        </div>
    </main>

    <div id="modal-ver-qr" class="modal-escaner" style="display:none;">
        <div class="modal-escaner-contenido">
            <div class="modal-escaner-header">
                <h3>Código QR del documento</h3>
                <button type="button" id="btn-cerrar-ver-qr" class="btn-cerrar">X</button>
            </div>
            <div class="qr-info">
                <p class="qr-info-titulo"><strong>Pertenece a:</strong> <span id="qr-ver-titulo">-</span></p>
                <div class="qr-imagen-contenedor">
                    <img id="qr-ver-imagen" src="" alt="Código QR" class="qr-imagen">
                </div>
                <p class="qr-info-categoria" id="qr-ver-categoria"></p>
            </div>
        </div>
    </div>

    <div id="modal-encuestas" class="modal-escaner" style="display:none;">
        <div class="modal-escaner-contenido modal-encuestas-contenido">
            <div class="modal-escaner-header">
                <h3>Encuestas pendientes</h3>
                <button type="button" id="btn-cerrar-encuestas" class="btn-cerrar">X</button>
            </div>
            <div class="encuestas-lista">
                <p id="encuestas-mensaje" class="encuestas-mensaje">Cargando encuestas...</p>
                <ul id="lista-encuestas-paciente" class="lista-encuestas"></ul>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
        <span class="footer-fecha" id="fechaPie"></span>
    </footer>

    <script src="../js/fecha_Y_hora.js"></script>
    <script src="../js/utilidades.js"></script>
    <script src="../js/buscador_Documentos.js"></script>
</body>
</html>
