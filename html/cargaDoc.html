<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos y título de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Documentos</title>
    <!-- Hoja de estilos de la página -->
    <link rel="stylesheet" href="../css/cargaDoc.css">
</head>
<body>
    <!-- Encabezado con el logo, el título, el reloj y el botón del menú -->
    <header>
        <img src="../img/logo_del_proyecto.jpeg" alt="Logo" class="header-logo">
        <h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
        <button class="menu-btn" id="menu-btn" aria-label="Menú">
            <span class="menu-linea"></span>
            <span class="menu-linea"></span>
            <span class="menu-linea"></span>
        </button>
    </header>

    <!-- Panel lateral del menú -->
    <div class="menu-panel" id="menu-panel">
        <button class="menu-cerrar" id="menu-cerrar" aria-label="Cerrar">X</button>
        <a href="cargaDoc.html" class="menu-opcion">Cargar Documento</a>
        <a href="documentosCargados.html" class="menu-opcion">Documentos Cargados</a>
        <a href="trazabilidad.html" class="menu-opcion">Vehículos para Reservar</a>
        <a href="vistaPreviaT.html" class="menu-opcion">Vista Previa</a>
        <a href="index.html" class="menu-opcion">Volver al inicio</a>
    </div>

    <!-- Contenido principal: formulario de carga de documento -->
    <main>
        <div class="panel form-panel">
            <h2>Cargar Documento</h2>
            <form action="" method="post" enctype="multipart/form-data" novalidate>
                <!-- Campo para elegir el archivo -->
                <div class="form-field">
                    <label for="archivo">Archivo (PDF u otro formato estándar):</label>
                    <input type="file" id="archivo" name="archivo" accept=".pdf,.doc,.docx,.odt,.txt">
                </div>

                <!-- Campo para elegir el título del documento -->
                <div class="form-field">
                    <label for="titulo">Título del documento:</label>
                    <select id="titulo" name="nombre">
                        <option value="" disabled selected>Seleccione un documento...</option>
                        <option value="interrupcion_embarazo">Indicaciones de interrupción voluntaria del embarazo</option>
                        <option value="prostatectomia">Prostatectomía radical (indicaciones e información para el paciente)</option>
                        <option value="estudios_imagenologicos">Preparación para estudios imagenológicos</option>
                        <option value="pertecneciato">Estudios diagnósticos con pertecneciato</option>
                        <option value="centellograma">Centellograma de perfusión miocárdica</option>
                        <option value="ecocardiograma_dobutamina">Indicaciones ecocardiograma con dobutamina</option>
                        <option value="warfarina">Indicaciones para pacientes en tratamiento con warfarina</option>
                        <option value="ecocardiograma_transesofagico">Indicaciones ecocardiograma transesofágico</option>
                        <option value="nefrologia_trasplante">Indicaciones para ingreso a centro de nefrología y trasplante</option>
                        <option value="alta_enfermeria">Plan de alta enfermería, Nefrología</option>
                        <option value="enfermeria_trasplantados">Indicaciones de enfermería para usuarios trasplantados</option>
                        <option value="prevencion_infecciones">Prevención de infecciones</option>
                        <option value="encuesta_satisfaccion">Encuesta de satisfacción del usuario trasplantado</option>
                        <option value="pauta_ostomizados">Pauta para pacientes ostomizados</option>
                    </select>
                </div>

                <!-- Campo de descripción del documento -->
                <div class="form-field">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="3"></textarea>
                </div>

                <!-- Campo para elegir la categoría -->
                <div class="form-field">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria">
                        <option value="" disabled selected>Seleccione una categoría...</option>
                        <option value="informacion_general">Información general</option>
                        <option value="indicaciones">Indicaciones médicas</option>
                        <option value="estudios">Estudios imagenológicos</option>
                        <option value="enfermeria">Enfermería</option>
                        <option value="encuestas">Encuestas</option>
                    </select>
                </div>

                <!-- Campo de fecha de publicación -->
                <div class="form-field">
                    <label for="fecha_publicacion">Fecha de publicación:</label>
                    <input type="date" id="fecha_publicacion" name="fecha_publicacion">
                </div>

                <!-- Botón para enviar el formulario -->
                <div class="form-field">
                    <input type="submit" value="Cargar Documento" id="carga_Documento">
                </div>
            </form>
        </div>
    </main>

    <!-- Pie de página con la fecha -->
    <footer>
        <p>&copy; Hospital de Clínicas</p>
        <span class="footer-fecha" id="fechaPie"></span>
    </footer>

    <!-- Scripts de control de acceso, carga, menú y reloj -->
    <script src="../js/auth.js"></script>
    <script src="../js/cargaDoc.js?v=4"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/fechaYhora.js"></script>
</body>
</html>
