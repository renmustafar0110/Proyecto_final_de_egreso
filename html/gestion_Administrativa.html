    </div>

    <main>
        <div class="contenedores">
            <div class="panel form-panel">
                <h2>Añadir Funcionario</h2>
                <form id="form-funcionario" action="" method="post" novalidate>
                    <div class="form-field">
                        <label for="cedula_funcionario">Cédula:</label>
                        <input type="text" id="cedula_funcionario" name="cedula_funcionario">
                    </div>

                    <div class="form-field">
                        <label for="nombre_funcionario">Nombre:</label>
                        <input type="text" id="nombre_funcionario" name="nombre_funcionario">
                    </div>

                    <div class="form-field">
                        <label for="apellido_funcionario">Apellido:</label>
                        <input type="text" id="apellido_funcionario" name="apellido_funcionario">
                    </div>

                    <div class="form-field">
                        <label for="cargo_funcionario">Cargo:</label>
                        <input type="text" id="cargo_funcionario" name="cargo_funcionario">
                    </div>

                    <div class="form-field">
                        <label for="password_funcionario">Contraseña:</label>
                        <input type="password" id="password_funcionario" name="password_funcionario">
                    </div>

                    <div class="form-field">
                        <label for="telefono_funcionario">Teléfono (conductor/copiloto):</label>
                        <input type="text" id="telefono_funcionario" name="telefono_funcionario" inputmode="numeric" placeholder="Opcional">
                    </div>

                    <div class="form-field">
                        <label class="checkbox-line">
                            <input type="checkbox" id="es_conductor" name="es_conductor" value="1">
                            Registrar también como conductor
                        </label>
                        <label class="checkbox-line">
                            <input type="checkbox" id="es_copiloto" name="es_copiloto" value="1">
                            Registrar también como copiloto
                        </label>
                    </div>

                    <div class="form-field">
                        <input type="submit" value="Registrar Funcionario">
                    </div>
                    <p class="form-mensaje" id="mensaje-funcionario"></p>
                </form>
            </div>

            <div class="panel form-panel">
                <h2>Añadir Paciente</h2>
                <form id="form-paciente" action="" method="post" novalidate>
                    <div class="form-field">
                        <label for="cedula_paciente">Cédula:</label>
                        <input type="text" id="cedula_paciente" name="cedula_paciente">
                    </div>

                    <div class="form-field">
                        <label for="nombre_paciente">Nombre:</label>
                        <input type="text" id="nombre_paciente" name="nombre_paciente">
                    </div>

                    <div class="form-field">
                        <label for="apellido_paciente">Apellido:</label>
                        <input type="text" id="apellido_paciente" name="apellido_paciente">
                    </div>

                    <div class="form-field">
                        <label for="fecha_nac">Fecha de nacimiento:</label>
                        <input type="date" id="fecha_nac" name="fecha_nac">
                    </div>

                    <div class="form-field">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono">
                    </div>

                    <div class="form-field">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-field">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion">
                    </div>

                    <div class="form-field">
                        <input type="submit" value="Registrar Paciente">
                    </div>
                    <p class="form-mensaje" id="mensaje-paciente"></p>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>

</body>
