<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Funcionario</title>
    <link rel="stylesheet" href="../css/loginF.css">
</head>
<body>
    <header>
        <img src="../logo_del_proyecto.jpeg" alt="Logo" class="logo-del-proyecto"><h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
    </header>

    <main>
        <div class="formulario-de-inicio-de-sesion">
            <h2>Inicio de Sesión - Funcionario</h2>
            <form action="" method="post" id="formulario-resto" novalidate>
                <div class="formulario-resto">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="formulario-resto">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido">
                </div>

                <div class="formulario-resto">
                    <label for="cedula">Cédula:</label>
                    <input type="text" id="cedula" name="cedula">
                </div>

                <div class="formulario-resto">
                    <input type="submit" value="Ingresar">
                </div>
            </form>
            <p class="back-link"><a href="RegistroF.html">¿No tenés cuenta? Registrate</a></p>
            <p class="back-link"><a href="index.html">&larr; Volver al inicio</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
    </footer>

    <script src="../js/fechaYhora.js"></script></body>
</html>
