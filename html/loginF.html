<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Funcionario</title>
    <link rel="stylesheet" href="../css/loginF.css">
</head>
<body>
    <header>
        <h1>Hospital de Clínicas</h1>
    </header>

    <main>
        <div class="panel form-panel">
            <h2>Inicio de Sesión - Funcionario</h2>
            <form action="" method="post" id="form-login" novalidate>
                <div class="form-field">
                    <label for="id">ID:</label>
                    <input type="text" id="id" name="id">
                </div>

                <div class="form-field">
                    <label for="cedula">Cédula:</label>
                    <input type="text" id="cedula" name="cedula">
                </div>

                <div class="form-field">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="form-field">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido">
                </div>

                <div class="alerta" id="alerta-acceso">Acceso denegado</div>

                <div class="form-field">
                    <input type="submit" value="Ingresar">
                </div>
            </form>
            <p class="back-link"><a href="index.html">&larr; Volver al inicio</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
    </footer>

    <script src="../js/loginF.js"></script>
</body>
</html>
