<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Funcionario</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="../css/loginF.css">
</head>
<body>
    <!-- Encabezado -->
    <header>
        <img src="../img/logo_del_proyecto.jpeg" alt="Logo" class="header-logo">
        <h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
    </header>

    <!-- Formulario de inicio de sesión -->
    <main>
        <div class="panel form-panel">
            <h2>Inicio de Sesión - Funcionario</h2>
            <form action="" method="post" novalidate>
                <!-- Cédula -->
                <div class="form-field">
                    <label for="cedula">Cédula:</label>
                    <input type="text" id="cedula" name="cedula">
                </div>

                <!-- Contraseña -->
                <div class="form-field">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password">
                    <label class="mostrar-contrasena">
                        <input type="checkbox" id="togglePassword"> Mostrar contraseña
                    </label>
                </div>

                <!-- Botón de envío -->
                <div class="form-field">
                    <input type="submit" value="Ingresar">
                </div>
            </form>
            <!-- Volver al inicio -->
            <p class="back-link"><a href="index.html">Volver al inicio</a></p>
        </div>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; Hospital de Clínicas</p>
        <span class="footer-fecha" id="fechaPie"></span>
    </footer>

    <!-- Scripts -->
    <script src="../js/fechaYhora.js"></script>
    <script src="../js/loginF.js"></script>
</body>
</html>
