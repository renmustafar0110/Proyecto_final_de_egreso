<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenar Traslado</title>
    <link rel="stylesheet" href="../css/trazabilidad.css">
</head>
<body>
    <header>
        <img src="../img/logo_del_proyecto.jpeg" alt="Logo" class="header-logo">
        <h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
        <button class="menu-btn" id="menu-btn" aria-label="Menú">
            <span class="menu-linea"></span>
            <span class="menu-linea"></span>
            <span class="menu-linea"></span>
        </button>
    </header>

    <div class="menu-panel" id="menu-panel">
        <button class="menu-cerrar" id="menu-cerrar" aria-label="Cerrar">X</button>
        <a href="carga_Documentos.html" class="menu-opcion">Cargar Documento</a>
        <a href="documentos_Cargados.html" class="menu-opcion">Documentos Cargados</a>
        <a href="trazabilidad.html" class="menu-opcion">Ordenar un Traslado</a>
        <a href="vistaPreviaT.html" class="menu-opcion">Vista Previa</a>
        <a href="index.html" class="menu-opcion">Volver al inicio</a>
    </div>

    <main>

        <div class="panel left-panel">
            <h2>Ordenar Traslado</h2>
            <form id="form-ordenar-traslado" autocomplete="off">
                <div class="form-field">
                    <label for="input-numero">Nº de coche:</label>
                    <input type="text" id="input-numero" name="numero_coche" list="lista-coches"
                           placeholder="Ej: Coche 01" autocomplete="off" required>
                    <datalist id="lista-coches"></datalist>
                </div>

                <div class="form-field">
                    <label for="input-origen">Origen:</label>
                    <input type="text" id="input-origen" name="origen" placeholder="Ej: Hospital" required>
                </div>

                <div class="form-field">
                    <label for="input-destino">Destino:</label>
                    <input type="text" id="input-destino" name="destino" placeholder="Ej: Clínica 2" required>
                </div>

                <div class="form-field">
                    <label for="input-hora-salida">Hora de salida:</label>
                    <input type="datetime-local" id="input-hora-salida" name="hora_salida" required>
                </div>

                <div class="form-field">
                    <label for="input-hora-llegada">Hora de llegada:</label>
                    <input type="datetime-local" id="input-hora-llegada" name="hora_llegada">
                </div>

                <div class="form-field">
                    <button type="submit" id="btn-ordenar-traslado">Ordenar Traslado</button>
                </div>
            </form>
        </div>

        <div class="panel right-panel">
            <h2>Ambulancias y Traslados</h2>
            <table class="veh-table">
                <thead>
                    <tr>
                        <th>Nº Coche</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-vehiculos">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
        <span class="footer-fecha" id="fechaPie"></span>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/trazabilidad.js"></script>
    <script src="../js/fechaYhora.js"></script>
</body>
</html>
