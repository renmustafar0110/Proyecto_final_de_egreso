<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../css/trazabilidad.css">
</head>
<body>
    <header>
        <img src="../logo_del_proyecto.jpeg" alt="Logo" class="header-logo"><h1>Hospital de Clínicas</h1>
        <div class="reloj" id="reloj"></div>
        <button class="menu-btn" id="menu-btn" aria-label="Menú">
            <span class="menu-linea"></span>
            <span class="menu-linea"></span>
            <span class="menu-linea"></span>
        </button>
    </header>

    <div class="menu-panel" id="menu-panel">
        <button class="menu-cerrar" id="menu-cerrar" aria-label="Cerrar">X</button>
        <a href="cargaDoc.html" class="menu-opcion">Cargar Documento</a>
        <a href="documentosCargados.html" class="menu-opcion">Documentos Cargados</a>

    <main>
        <div class="panel left-panel">
            <h2>Cargar Nuevo Vehículo</h2>
            <form id="form-cargar-vehiculo" autocomplete="off">
                <div class="form-field">
                    <label for="input-numero">Nº de coche:</label>
                    <input type="text" id="input-numero" name="numero_coche" placeholder="Ej: 04" required>
                </div>

                <div class="form-field">
                    <button type="submit" id="btn-cargar-vehiculo">Cargar Vehículo</button>
                </div>
            </form>
        </div>

        <div class="panel right-panel">
            <h2>Vehículos para Reservar</h2>
            <table class="veh-table">
                <thead>
                    <tr>
                        <th>Nº Coche</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-vehiculos">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; Hospital de Clínicas</p>
        <span class="footer-fecha" id="fechaPie"></span>
    </footer>
